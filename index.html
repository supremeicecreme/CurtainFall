<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>IceCore Landing</title>
</head>
<body onload="Start()">
    <section id="time-date">
        <span id="date"></span>
        <span id="clock"></span>
        <span id="greeting"></span>
    </section>
    <section class="search-area">
        <form action="https://google.com/search" method="get">
            <label for="search" hidden>Search: </label><input type="search" name="q" id="search-bar" placeholder="Search Google" autofocus autocomplete="off">
        </form>
    </section>
    <section class="link-area">
        <h2>Popular</h2>
        <div class="links">
            <a href="https://www.google.com">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">Google Search</span>
            </a>
            <a href="https://mail.google.com">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">Gmail</span>
            </a>
            <a href="https://outlook.live.com">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">Outlook</span>
            </a>
            <a href="https://bbc.co.uk/news">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">BBC News</span>
            </a>
        </div>
    </section>
    <section class="link-area secondary">
        <h2>BTPLF</h2>
        <div class="links">
            <a href="https://btplf.net">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">BTPLF Portal</span>
            </a>
            <a href="https://cloud.btplf.net">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">BTPLF Cloud</span>
            </a>
            <a href="https://mail.btplf.net">
                <span class="link-icon material-symbols-outlined">language</span>
                <span class="link-text">BTPLF Mail</span>
            </a>

        </div>
    </section>
    <footer>
        <p>by IceCore Technologies</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
